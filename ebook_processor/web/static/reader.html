<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<style>
:root {
  --paper: #ebebeb; --sheet: #f6f6f6; --ink: #121212; --ghost: #d6d6d6; --mute: #686868; --blue: #2b36f5; --on-blue: #ffffff;
  --grot: "Neue Haas Grotesk Display Pro", "Helvetica Neue", Helvetica, "Inter Display", Inter, Arimo, "Liberation Sans", Arial, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Source Serif 4", Charter, Georgia, "DejaVu Serif", serif;
  --face: var(--serif); --size: 19px; --lead: 1.6; --measure: 34em; --gut: clamp(14px, 2.4vw, 28px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) { --paper: #0e0e0e; --sheet: #171717; --ink: #eceae4; --ghost: #303030; --mute: #9b9992; --blue: #7f89ff; --on-blue: #0e0e0e; }
}
:root[data-theme=dark] { --paper: #0e0e0e; --sheet: #171717; --ink: #eceae4; --ghost: #303030; --mute: #9b9992; --blue: #7f89ff; --on-blue: #0e0e0e; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.45 var(--grot); -webkit-font-smoothing: antialiased; overflow: hidden; }
.shell { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-width: 1400px; margin: 0 auto; padding: 0 var(--gut); border-left: 1px solid var(--ghost); border-right: 1px solid var(--ghost); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.m { font: 12px/1.5 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.mute { color: var(--mute); } .raw { text-transform: none; }
button { font: 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 0; background: transparent; color: var(--ink); padding: 9px 11px; cursor: pointer; }
button:hover { background: var(--ink); color: var(--paper); }
button.primary { background: var(--ink); color: var(--paper); padding: 13px 20px; font-size: 13px; }
button.primary:hover { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
button.link { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 9px 4px; }
button.link:hover { background: transparent; color: var(--blue); }
button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; } .seg button { margin-right: -1px; }

/* top and bottom strips */
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--ink); flex-wrap: wrap; }
.top .where { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 14px; }
.top .where b { font: 500 17px/1.2 var(--grot); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .where span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot { padding: 10px 0 12px; border-top: 1px solid var(--ink); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 18px; align-items: center; }
.map { display: flex; align-items: flex-start; gap: 2px; overflow: hidden; }
.map .col { flex: var(--w) 1 0; min-width: 3px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.map .sec { display: block; align-self: stretch; height: 14px; background: var(--ghost); border: 0; padding: 0; }
.map .sec.read { background: var(--ink); } .map .sec.now { background: var(--blue); }
.map .sec:hover { background: var(--blue); }
.map .col > i { width: 5px; height: 5px; box-shadow: inset 0 0 0 1px var(--mute); }
.map .col > i.ok { background: var(--blue); box-shadow: none; } .map .col > i.no { background: var(--ink); box-shadow: none; }
.map .gap { flex: 0 0 6px; }
.banner { background: var(--ink); color: var(--paper); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; grid-column: 1 / -1; }
.banner button { border-color: var(--paper); color: var(--paper); } .banner button:hover { background: var(--paper); color: var(--ink); }

/* the stage */
#stage { position: relative; min-height: 0; overflow: hidden; }
.text { font-family: var(--face); font-size: var(--size); line-height: var(--lead); }
.text p { margin: 0; text-indent: 1.3em; text-wrap: pretty; hyphens: auto; }
.text h1 + p, .text h2 + p, .text h3 + p, .text h4 + p, .text hr + p, .text blockquote + p, .text figure + p, .text p:first-child, .text table + p, .text pre + p { text-indent: 0; }
.text h1, .text h2, .text h3, .text h4, .text h5, .text h6 { font-family: var(--grot); font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; margin: 1.4em 0 0.6em; break-after: avoid; text-wrap: balance; }
.text h1 { font-size: 2em; margin-top: 0.4em; } .text h2 { font-size: 1.5em; } .text h3 { font-size: 1.2em; } .text h4, .text h5, .text h6 { font-size: 1em; }
.text blockquote { margin: 1em 0 1em 1.3em; padding-left: 1em; border-left: 2px solid var(--ghost); }
.text ul, .text ol { margin: 0.8em 0; padding-left: 1.6em; } .text li p { text-indent: 0; }
.text img { max-width: 100%; max-height: var(--img-h, 70vh); display: block; margin: 1em auto; break-inside: avoid; }
.text figure { margin: 1.2em 0; break-inside: avoid; } .text figcaption, .text caption { font: 0.8em/1.4 var(--grot); color: var(--mute); margin-top: 0.5em; text-align: left; }
.text table { border-collapse: collapse; margin: 1em 0; font: 0.85em/1.4 var(--grot); break-inside: avoid; }
.text td, .text th { border: 1px solid var(--ghost); padding: 5px 9px; text-align: left; vertical-align: top; }
.text th { font-weight: 600; border-bottom-color: var(--ink); }
.text pre { font: 0.78em/1.5 var(--mono); background: var(--sheet); border: 1px solid var(--ghost); padding: 12px 14px; overflow-x: auto; white-space: pre-wrap; break-inside: avoid; margin: 1em 0; }
.text code { font-family: var(--mono); font-size: 0.86em; }
.text hr { border: 0; border-top: 1px solid var(--ghost); margin: 1.6em 25%; }
.text a.noteref { text-decoration: none; color: var(--blue); cursor: pointer; font-family: var(--grot); padding: 0 2px; }
.text a[data-go] { cursor: pointer; text-decoration-color: var(--ghost); }
.text .note-body { font-size: 0.85em; color: var(--mute); border-top: 1px solid var(--ghost); margin-top: 2em; padding-top: 0.8em; }
.text .note-body p { text-indent: 0; }
.text .hit { background: color-mix(in srgb, var(--blue) 22%, transparent); }
::highlight(hl) { background-color: color-mix(in srgb, var(--blue) 24%, transparent); }
::highlight(hln) { background-color: color-mix(in srgb, var(--blue) 24%, transparent); text-decoration: underline; text-decoration-color: var(--blue); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.text [data-note]::before { content: ""; display: inline-block; width: 0.5em; height: 0.5em; background: var(--blue); margin-right: 0.4em; vertical-align: 0.12em; }
.tip { position: fixed; z-index: 15; display: flex; background: var(--ink); padding: 3px; gap: 3px; transform: translate(-50%, -100%); }
.tip button { border-color: var(--ink); background: var(--ink); color: var(--paper); padding: 8px 10px; }
.tip button:hover { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.offer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--sheet); border-top: 1px solid var(--ink); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.ed blockquote { margin: 0 0 14px; padding: 2px 0 2px 12px; border-left: 8px solid var(--ghost); font: 16px/1.5 var(--serif); }
.ed textarea { width: 100%; min-height: 180px; font: 16px/1.5 var(--serif); color: var(--ink); background: var(--sheet); border: 1px solid var(--ink); border-radius: 0; padding: 10px 12px; resize: vertical; }
.ed .acts { margin-top: 12px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.marks a { display: block; text-decoration: none; padding: 10px 0; border-bottom: 1px solid var(--ghost); cursor: pointer; }
.marks a:hover { color: var(--blue); } .marks q { font: 15px/1.45 var(--serif); quotes: none; display: block; }
.marks small { display: block; color: var(--mute); margin-top: 4px; white-space: pre-wrap; }
.rv .word.lit { text-decoration: underline; text-decoration-color: var(--blue); text-decoration-thickness: 4px; text-underline-offset: 10px; }
.rv .ctx span.lit { background: color-mix(in srgb, var(--blue) 24%, transparent); color: var(--ink); }

/* paged */
.pv { position: absolute; inset: 22px 0 16px; overflow: hidden; }
.pv .cols { height: 100%; column-fill: auto; will-change: transform; }
/* scroll */
.sv { position: absolute; inset: 0; overflow-y: auto; padding: 28px 0 60px; }
.sv .text { max-width: var(--measure); margin: 0 auto; overflow: hidden; }
.gate { font-family: var(--grot); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 1.6em 0; padding: 16px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.gate b { font: 500 20px/1.2 var(--grot); letter-spacing: -0.03em; display: block; }
.gate.done { border-color: var(--ghost); padding: 8px 0; } .gate.done b { font-size: 15px; font-weight: 400; color: var(--mute); }
.chapnav { max-width: var(--measure); margin: 2em auto 0; display: flex; justify-content: space-between; gap: 10px; }
/* rsvp */
.rv { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(120px, 1fr) auto minmax(0, 1.1fr); gap: 10px; padding: 16px 0; }
.rv .word { align-self: end; display: grid; grid-template-columns: 1fr auto 1.6fr; align-items: baseline; font: 500 clamp(40px, 6.4vw, 84px)/1.1 var(--grot); letter-spacing: -0.02em; padding: 18px 0; position: relative; white-space: nowrap; }
.rv .word::before, .rv .word::after { content: ""; position: absolute; left: var(--fx, 38.5%); width: 1px; height: 12px; background: var(--ink); }
.rv .word::before { top: 0; } .rv .word::after { bottom: 0; }
.rv .word .pre { text-align: right; } .rv .word .focus { color: var(--blue); } .rv .word.group { display: block; text-align: center; }
.rv .word.group::before, .rv .word.group::after { display: none; }
.rv .ctl { display: flex; justify-content: center; align-items: center; gap: 18px; flex-wrap: wrap; border-top: 1px solid var(--ghost); border-bottom: 1px solid var(--ghost); padding: 12px 0; }
.rv .ctx { overflow: auto; max-width: 46em; margin: 0 auto; padding: 4px 0; color: var(--mute); font: 17px/1.6 var(--serif); }
.rv .ctx span { cursor: pointer; } .rv .ctx span:hover { color: var(--ink); } .rv .ctx span.cur { color: var(--on-blue); background: var(--blue); }
.rv .ctx .text { max-width: 34em; margin: 0 auto; color: var(--ink); }
.rv .num { font-variant-numeric: tabular-nums; min-width: 4ch; text-align: center; display: inline-block; }

/* checkpoint */
.cp { position: absolute; inset: 0; background: var(--paper); z-index: 5; overflow: auto; display: grid; align-content: center; padding: 24px 0; }
.cp .in { max-width: 900px; width: 100%; margin: 0 auto; position: relative; }
.cp .in::before, .cp .in::after { content: ""; position: absolute; width: 21px; height: 21px; pointer-events: none; background: linear-gradient(var(--ink), var(--ink)) center / 1px 100% no-repeat, linear-gradient(var(--ink), var(--ink)) center / 100% 1px no-repeat; }
.cp .in::before { top: -22px; left: -11px; } .cp .in::after { bottom: -22px; right: -11px; }
.cp .head { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 26px; flex-wrap: wrap; }
.cp h1 { font: 500 clamp(26px, 3.6vw, 44px)/1.12 var(--grot); letter-spacing: -0.035em; margin: 0 0 26px; text-wrap: balance; }
.cp textarea { width: 100%; min-height: 110px; font: 17px/1.5 var(--serif); color: var(--ink); background: var(--sheet); border: 1px solid var(--ink); border-radius: 0; padding: 12px 14px; resize: vertical; }
.cp .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--ink); }
.cp .two > div { padding: 14px 16px 18px; } .cp .two > div + div { border-left: 1px solid var(--ink); background: var(--sheet); }
.cp .two p { margin: 8px 0 0; font: 18px/1.5 var(--serif); white-space: pre-wrap; }
.cp .acts { margin-top: 22px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.cp .note { margin: 14px 0 0; color: var(--mute); }
.lab { display: inline-block; font: 11px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 6px; border: 1px solid var(--ink); white-space: nowrap; }
.lab.inv { background: var(--ink); color: var(--paper); } .lab.blue { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
kbd { font: 11px/1 var(--mono); border: 1px solid currentColor; padding: 2px 4px; margin-left: 6px; opacity: 0.7; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--paper); border-left: 1px solid var(--ink); z-index: 20; display: none; grid-template-rows: auto minmax(0, 1fr); }
.drawer.on { display: grid; }
.drawer > header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--ink); }
.drawer > header b { font: 500 20px/1.2 var(--grot); letter-spacing: -0.03em; }
.drawer .body { overflow: auto; padding: 14px 18px 30px; }
.drawer input[type=text] { width: 100%; font: 16px/1.2 var(--grot); color: var(--ink); background: var(--sheet); border: 1px solid var(--ink); padding: 10px 11px; border-radius: 0; }
.toc a, .hits a { display: block; text-decoration: none; padding: 8px 0; border-bottom: 1px solid var(--ghost); cursor: pointer; }
.toc a:hover, .hits a:hover { color: var(--blue); }
.toc a.ch { font: 500 17px/1.25 var(--grot); letter-spacing: -0.02em; border-bottom-color: var(--ink); margin-top: 12px; }
.toc a.se { padding-left: 14px; display: flex; justify-content: space-between; gap: 10px; } .toc a.cur { color: var(--blue); }
.toc .sq { display: inline-flex; gap: 2px; align-items: center; flex: none; }
.toc .sq i { width: 7px; height: 7px; box-shadow: inset 0 0 0 1px var(--mute); } .toc .sq i.ok { background: var(--blue); box-shadow: none; } .toc .sq i.no { background: var(--ink); box-shadow: none; }
.hits a b { background: color-mix(in srgb, var(--blue) 22%, transparent); font-weight: inherit; }
.set { display: grid; gap: 18px; } .set > div > .m { display: block; margin-bottom: 6px; }
.notebox { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--sheet); border-top: 1px solid var(--ink); padding: 14px 18px 18px; max-height: 45%; overflow: auto; }
.notebox .text { max-width: 44em; margin: 0 auto; font-size: 16px; } .notebox .text p { text-indent: 0; }
.empty { color: var(--mute); padding: 30px 0; text-align: center; }
@media (max-width: 720px) { .cp .two { grid-template-columns: 1fr; } .cp .two > div + div { border-left: 0; border-top: 1px solid var(--ink); } .top .where span { display: none; } }
@media (prefers-reduced-motion: no-preference) { .pv .cols { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="where"><a class="m" href="/" id="back">← Book page</a><b id="t-book"></b><span class="m mute" id="t-chap"></span></div>
    <div class="row">
      <span class="seg" role="group" aria-label="Reading mode" id="modes"></span>
      <button id="b-toc">Contents</button><button id="b-find">Search</button><button id="b-rev">Practice</button><button id="b-notes">Notes</button><button id="b-set" aria-label="Text settings">Aa</button>
    </div>
  </header>
  <main id="stage"><p class="empty">Loading</p></main>
  <footer class="foot" id="foot"></footer>
</div>
<aside class="drawer" id="drawer" aria-label="Panel"><header><b id="d-title"></b><button id="d-close">Close</button></header><div class="body" id="d-body"></div></aside>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "html") el.innerHTML = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "disabled" || k === "value") el[k] = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat(3).filter((k) => k != null && k !== false));
async function api(path, options = {}) {
  const headers = { "X-Ebook-Processor": "1", ...(options.headers || {}) };
  if (options.json !== undefined) { options.body = JSON.stringify(options.json); headers["Content-Type"] = "application/json"; }
  const response = await fetch("/api" + path, { ...options, headers });
  const data = await response.json().catch(() => ({ error: "The app gave an unreadable answer." }));
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}
const fmt = (n) => Number(n).toLocaleString("en");
const stamp = () => new Date().toISOString().slice(0, 19);
const MODES = [["page", "Page"], ["scroll", "Scroll"], ["rsvp", "RSVP"]];
const PARA_END = 2, NONPROSE = 8;
const ID = decodeURIComponent(location.pathname.split("/").pop());
const stage = $("stage");

/* ---------- what is loaded ---------- */
let book, S, settings = { face: "serif", size: 19, leading: 1.6, measure: "medium", theme: "system" };
const chapters = new Map();           // chapter index -> { html, words, flags, markers, skip, stops }
let mode = "page", pos = { chapter: 0, word: 0 };
let handled = new Set();              // sections whose checkpoint is behind the reader on this pass
let cp = null;                        // the open checkpoint: { section, index, revealed, missed, text, review }
let reread = null;                    // { section, back: mode to return to }
let view = null;                      // the current mode's controller
let lastActive = Date.now();
let practiceDue = 0;                  // cards of this book waiting in the practice queue
function refreshPractice() {
  api(`/practice?job=${encodeURIComponent(ID)}`).then((d) => { practiceDue = d.left; drawTop(); }).catch(() => {});
}

const sectionsIn = (c) => book.sections.filter((s) => s.chapter === c);
const chapterAt = (c) => book.chapters.find((x) => x.index === c);
const chapterOrder = (c) => book.chapters.findIndex((x) => x.index === c);
const sectionAt = (c, w) => sectionsIn(c).find((s) => w >= s.start && w < s.end);
function wordsBefore(c, w) { let n = 0; for (const x of book.chapters) { if (x.index === c) return n + Math.min(w, x.words); n += x.words; } return n; }
async function chapter(c) {
  if (!chapters.has(c)) {
    const data = await api(`/jobs/${ID}/book/chapter/${c}`);
    data.skip = new Uint8Array(data.words.length); data.stops = new Map();
    for (const [kind, a, b] of data.markers) {
      if (kind === "IMAGE") data.stops.set(a, kind);
      else { for (let i = a; i < b; i++) data.skip[i] = 1; if (kind !== "NOTE") data.stops.set(a, kind); }
    }
    chapters.set(c, data);
  }
  return chapters.get(c);
}
function fill(container, html) {
  container.innerHTML = html;
  for (const img of container.querySelectorAll("img[data-src]")) img.src = `/api/jobs/${ID}/book/asset?path=${encodeURIComponent(img.dataset.src)}`;
}

/* ---------- saving ---------- */
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const send = () => fetch(`/api/jobs/${ID}/reading`, { method: "PUT", keepalive: true, headers: { "X-Ebook-Processor": "1", "Content-Type": "application/json" }, body: JSON.stringify(S) }).catch(() => {});
  if (now) send(); else saveTimer = setTimeout(send, 700);
}
function setPos(c, w, forward) {
  if (forward && c === pos.chapter && w > pos.word && mode !== "rsvp") S.x_stats.words[mode] += Math.min(w - pos.word, 4000);
  pos = { chapter: c, word: w };
  if (!reread) {
    S.position = { chapter: c, word: w, mode };
    const f = S.x_furthest;
    if (!f || chapterOrder(c) > chapterOrder(f.chapter) || (c === f.chapter && w > f.word)) S.x_furthest = { chapter: c, word: w };
    S.x_progress = book.words ? Math.min(1, wordsBefore(c, w) / book.words) : 0;
  } else if (S.active_checkpoint) S.active_checkpoint.reread = { mode, chapter: c, word: w };
  S.x_stats.last_read = stamp();
  drawFoot(); save();
}
setInterval(() => {
  const playing = view && view.playing;
  if (document.visibilityState === "visible" && !cp && (playing || Date.now() - lastActive < 60000)) { S.x_stats.seconds[mode] += 5; save(); }
}, 5000);
for (const type of ["keydown", "pointerdown", "wheel", "scroll"]) addEventListener(type, () => { lastActive = Date.now(); }, { capture: true, passive: true });
addEventListener("pagehide", () => save(true));

/* ---------- top, foot ---------- */
function drawTop() {
  $("t-book").textContent = book.title;
  const sec = sectionAt(pos.chapter, pos.word);
  $("t-chap").textContent = (chapterAt(pos.chapter)?.title || "") + (sec && sec.label !== chapterAt(pos.chapter)?.title ? " / " + sec.label : "");
  put($("modes"), MODES.map(([k, t], n) => h("button", { "aria-pressed": String(mode === k), title: `${t} view (${n + 1})`, onclick: () => setMode(k) }, t)));
  $("b-rev").textContent = practiceDue ? `Practice ${practiceDue}` : "Practice";
}
function pace() {
  if (mode === "rsvp") return S.overrides.wpm;
  const s = S.x_stats.seconds[mode], w = S.x_stats.words[mode];
  return s >= 120 && w > 200 ? Math.max(80, Math.min(700, 60 * w / s)) : 240;
}
function drawFoot() {
  const foot = $("foot"), f = S.x_furthest;

  if (!was.review) { S.active_checkpoint = { id: section.checkpoint, prompt_index: was.index, resume: was.resume, reread: { mode: m, chapter: section.chapter, word: section.start } }; }
  mode = m; pos = { chapter: section.chapter, word: section.start };
  await render(); save(true);
}
async function endReread() {
  if (!reread) return;
  const { section, held } = reread; reread = null;
  if (view && view.stop) view.stop();
  if (S.active_checkpoint) delete S.active_checkpoint.reread;
  if (held.review) { await render(); cp = { ...held, revealed: false, missed: false, text: "" }; return drawCp(); }
  mode = held.resume.mode; pos = { chapter: held.resume.chapter, word: held.resume.word };
  await render();
  cp = { section, index: held.index, revealed: false, missed: false, text: "", resume: held.resume };   // the same question, answer hidden
  persistCp(); drawCp(); drawFoot();
}

/* ---------- highlights and notes ---------- */
// A highlight is a run of words of a chapter, [start, end) in the shared word positions. In the page and scroll
// views the words are found in the text by splitting it as the engine does, block by block, and marked with the
// CSS Custom Highlight API, which draws without changing the document.
let NB = { highlights: [], notes: [] };
let view_root = null;                 // the element holding the chapter's text in the page and scroll views
let tipFor = null;                    // the word range the floating buttons act on
const SEP = new Set([0x09, 0x0A, 0x0C, 0x0D, 0x20, 0xA0, 0x1680, 0x2028, 0x2029, 0x202F, 0x205F, 0x3000, ...Array.from({ length: 12 }, (_, n) => 0x2000 + n)]);
const BLOCKY = new Set("P DIV LI UL OL DL DT DD TABLE TR TD TH THEAD TBODY TFOOT CAPTION BLOCKQUOTE H1 H2 H3 H4 H5 H6 PRE FIGURE FIGCAPTION SECTION ARTICLE ASIDE HEADER FOOTER MAIN HR BR IMG ADDRESS".split(" "));
const maps = new WeakMap();
function wordMap(block) {             // where each word of a block lies in its text nodes
  if (maps.has(block)) return maps.get(block);
  const out = []; let cur = null, last = "";
  const flush = () => { if (cur) out.push(cur); cur = null; last = ""; };
  (function walk(el) {
    for (const n of el.childNodes) {
      if (n.nodeType === 3) {
        const t = n.data;
        for (let k = 0; k < t.length;) {
          const cp = t.codePointAt(k), len = cp > 0xFFFF ? 2 : 1;
          if (SEP.has(cp)) flush();
          else if (cp !== 0xAD && cp !== 0xFEFF) {
            if (cur && (last === "–" || last === "—")) flush();
            if (!cur) cur = { node: n, a: k };
            cur.endNode = n; cur.b = k + len; last = t.substr(k, len);
          }
          k += len;
        }
      } else if (n.nodeType === 1 && !n.matches("a.noteref")) {
        const blocky = BLOCKY.has(n.tagName);
        if (blocky) flush();
        walk(n);
        if (blocky) flush();
      }
    }
  })(block);
  flush(); maps.set(block, out);
  return out;
}
function rangesFor(start, end) {      // DOM ranges covering words [start, end) of the chapter on screen
  const out = [];
  if (!view_root) return out;
  for (const block of view_root.querySelectorAll("[data-w]")) {
    const w = +block.dataset.w, map = wordMap(block);
    if (!map.length || w >= end || w + map.length <= start) continue;
    const a = map[Math.max(start, w) - w], b = map[Math.min(end, w + map.length) - 1 - w];
    const r = document.createRange(); r.setStart(a.node, a.a); r.setEnd(b.endNode, b.b); out.push(r);
  }
  return out;
}
function paint() {
  if (!view_root) { if (view && view.relayout) view.relayout(); return; }
  for (const el of view_root.querySelectorAll("[data-note]")) el.removeAttribute("data-note");
  for (const n of NB.notes) if (n.on === "place" && n.chapter === pos.chapter) view_root.querySelector(`[data-w="${n.word}"]`)?.setAttribute("data-note", "");
  if (!window.Highlight || !CSS.highlights) return;
  const plain = new Highlight(), noted = new Highlight();
  for (const x of NB.highlights) if (x.chapter === pos.chapter) for (const r of rangesFor(x.start, x.end)) (x.note ? noted : plain).add(r);
  CSS.highlights.set("hl", plain); CSS.highlights.set("hln", noted);
}
function wordAt(node, offset) {       // the chapter word at a place in the text, or -1
  const block = (node.nodeType === 1 ? node : node.parentElement)?.closest("[data-w]");
  if (!block || !view_root || !view_root.contains(block)) return -1;
  const k = wordMap(block).findIndex((m) => (m.node === node || m.endNode === node) && (m.node !== node || m.a <= offset) && (m.endNode !== node || offset <= m.b));
  return k < 0 ? -1 : +block.dataset.w + k;
}
function selectionWords() {           // the words a text selection covers, as { chapter, start, end }
  const sel = getSelection();
  if (!view_root || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  let start = Infinity, end = -1;
  for (const block of view_root.querySelectorAll("[data-w]")) {
    if (!r.intersectsNode(block)) continue;
    const w = +block.dataset.w;
    wordMap(block).forEach((m, k) => {
      const before = r.comparePoint(m.endNode, m.b) < 0 || (m.endNode === r.startContainer && m.b === r.startOffset);
      const after = r.comparePoint(m.node, m.a) > 0 || (m.node === r.endContainer && m.a === r.endOffset);
      if (!before && !after) { start = Math.min(start, w + k); end = Math.max(end, w + k + 1); }
    });
  }
  return end > start ? { chapter: pos.chapter, start, end } : null;
}
function hideTip() { document.querySelector(".tip")?.remove(); tipFor = null; }
function showTip(rect, range) {
  hideTip(); tipFor = range;
  const act = (withNote) => async () => { const r = tipFor; hideTip(); getSelection().removeAllRanges(); const made = await addHighlight(r); if (withNote && made) editItem(made); };
  document.body.append(h("div", { class: "tip", style: `left:${rect.left + rect.width / 2}px;top:${Math.max(48, rect.top - 6)}px` },
    h("button", { onmousedown: (e) => e.preventDefault(), onclick: act(false) }, "Highlight", h("kbd", {}, "h")),
    h("button", { onmousedown: (e) => e.preventDefault(), onclick: act(true) }, "Note", h("kbd", {}, "n"))));
}
document.addEventListener("mouseup", (e) => {
  if (e.target.closest(".tip, .drawer, .cp, .rv")) return;
  setTimeout(() => { const range = selectionWords(); if (range) showTip(getSelection().getRangeAt(0).getBoundingClientRect(), range); else hideTip(); }, 0);
});
async function notesCall(path, options) {
  try { NB = await api(`/jobs/${ID}/notes${path}`, options); } catch (e) { alert(e.message); return null; }
  paint(); if (mode === "page" && view && view.relayout) view.relayout();
  return NB;
}
async function addHighlight(range) {
  const got = await notesCall("/highlight", { method: "POST", json: range });
  return got ? NB.highlights.find((x) => x.id === got.made) : null;
}
function editor(title, quote, text, onSave, onRemove, removeLabel) {
  const area = h("textarea", { placeholder: "Your note, in your own words. Markdown works.", "aria-label": "Note", value: text || "" });
  const done = async (fn) => { if (await fn() !== null) closeDrawer(); };
  area.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); done(() => onSave(area.value)); } });
  openDrawer(title, h("div", { class: "ed" }, quote ? h("blockquote", {}, quote) : null, area,
    h("div", { class: "acts" }, h("button", { class: "primary", onclick: () => done(() => onSave(area.value)) }, "Save", h("kbd", {}, "ctrl ↵")),
      onRemove ? h("button", { class: "link", onclick: () => done(onRemove) }, removeLabel) : null)));
  area.focus();
}
function editItem(x) {                // a highlight and its note
  editor("Highlight", x.text, x.note,
    (text) => notesCall(`/item/${x.id}`, { method: "PUT", json: { text } }),
    () => (!x.note || confirm("Remove this highlight and its note?")) ? notesCall(`/item/${x.id}`, { method: "DELETE" }) : null, "Remove highlight");
}
function editTarget(title, target, quote) {
  const match = (n) => n.on === target.on && (target.on !== "place" || (n.chapter === target.chapter && n.word === target.word))
    && (target.on !== "section" || n.section === target.section) && (target.on !== "chapter" || n.chapter === target.chapter);
  const existing = NB.notes.find(match);
  editor(title, quote, existing ? existing.text : "",
    (text) => notesCall("/target", { method: "PUT", json: { target, text } }),
    existing ? () => confirm("Delete this note?") ? notesCall("/target", { method: "PUT", json: { target, text: "" } }) : null : null, "Delete note");
}
let hovered = null;
document.addEventListener("mousemove", (e) => { hovered = e.target.closest ? e.target.closest(".text [data-w]") : null; }, { passive: true });
function editPlace() {                // a note on the paragraph under the pointer, else the one at the reading position
  const block = (hovered && view_root && view_root.contains(hovered) ? hovered : null)
    || (view_root && [...view_root.querySelectorAll("[data-w]")].filter((b) => +b.dataset.w <= pos.word).pop());
  if (!block) return;
  const words = block.textContent.trim().split(/\s+/);
  editTarget("Note on this paragraph", { on: "place", chapter: pos.chapter, word: +block.dataset.w }, words.slice(0, 24).join(" ") + (words.length > 24 ? " …" : ""));
}
function offerNote(section) {
  stage.querySelector(".offer")?.remove();
  const has = NB.notes.some((n) => n.on === "section" && n.section === section.id);
  stage.append(h("div", { class: "offer" }, h("span", { class: "m" }, section.label),
    h("span", { class: "row" }, h("button", { onclick: () => { stage.querySelector(".offer")?.remove(); editTarget("Note on " + section.label, { on: "section", section: section.id }); } }, has ? "Edit your note on this section" : "Add a note on this section"),
      h("button", { class: "link", onclick: () => stage.querySelector(".offer")?.remove() }, "Not now"))));
}
function marks() {                    // this chapter's highlights and notes, and the ways to add the larger ones
  const here = sectionAt(pos.chapter, pos.word);
  const rows = [...NB.highlights.filter((x) => x.chapter === pos.chapter).map((x) => ({ w: x.start, x })),
    ...NB.notes.filter((n) => n.on === "place" && n.chapter === pos.chapter).map((n) => ({ w: n.word, n }))].sort((a, b) => a.w - b.w);
  openDrawer("Notes", [
    h("div", { class: "row", style: "margin-bottom:14px" },
      here ? h("button", { onclick: () => editTarget("Note on " + here.label, { on: "section", section: here.id }) }, "This section") : null,
      h("button", { onclick: () => editTarget("Note on the book", { on: "book" }) }, "The book"),
      h("a", { class: "m", href: "/#/notebook/" + ID, style: "margin-left:auto" }, "Open the notebook")),
    h("p", { class: "mute", style: "margin:0 0 6px" }, "Select text and press h to highlight it, n to add a note. With nothing selected, n notes the paragraph under the pointer."),
    h("div", { class: "marks" }, rows.length ? rows.map(({ w, x, n }) => h("a", { onclick: () => { jump(pos.chapter, w).then(() => x ? editItem(x) : editTarget("Note on this paragraph", { on: "place", chapter: n.chapter, word: n.word })); } },
      x ? h("q", {}, x.text.length > 220 ? x.text.slice(0, 220) + " …" : x.text) : null, h("small", {}, x ? x.note : n.text))) : h("p", { class: "empty" }, "Nothing marked in this chapter yet."))]);
}

/* ---------- links, footnotes ---------- */
function closeNote() { stage.querySelector(".notebox")?.remove(); }
function wire(root) {
  root.addEventListener("click", async (e) => {
    const a = e.target.closest("a[data-go]");
    if (!a && getSelection().isCollapsed) {
      const at = document.caretPositionFromPoint ? document.caretPositionFromPoint(e.clientX, e.clientY) : null;
      const cr = at ? null : document.caretRangeFromPoint?.(e.clientX, e.clientY);
      const w = at ? wordAt(at.offsetNode, at.offset) : cr ? wordAt(cr.startContainer, cr.startOffset) : -1;
      const hit = w < 0 ? null : NB.highlights.find((x) => x.chapter === pos.chapter && x.start <= w && w < x.end);
      if (hit) { e.stopPropagation(); editItem(hit); }
    }
    if (!a) return;
    e.preventDefault(); e.stopPropagation();
    const [c, id] = [+a.dataset.go.split(":")[0], a.dataset.go.slice(a.dataset.go.indexOf(":") + 1)];
    const data = await chapter(c), dom = h("div"); fill(dom, data.html);
    const target = id ? dom.querySelector(`[data-id="${CSS.escape(id)}"]`) : null;
    if (a.classList.contains("noteref") && target) {
      closeNote();
      const body = h("div", { class: "text" }); body.innerHTML = (target.closest(".note-body") || target).innerHTML;
      for (const back of body.querySelectorAll("a[data-go]")) if (/^[↩⏎↑←]/.test(back.textContent.trim())) back.remove();
      stage.append(h("div", { class: "notebox", role: "note" }, h("div", { class: "row", style: "justify-content:space-between;margin-bottom:8px" }, h("span", { class: "m" }, "Note " + a.textContent.trim()), h("button", { class: "link", onclick: closeNote }, "Close")), body));
    } else { const b = target && (target.closest("[data-w]") || target.querySelector("[data-w]")); jump(c, b ? +b.dataset.w : 0); }
  });
}

/* ---------- drawer: contents, search, settings ---------- */
function openDrawer(title, body) { $("d-title").textContent = title; put($("d-body"), body); $("drawer").classList.add("on"); }
function closeDrawer() { $("drawer").classList.remove("on"); }
$("d-close").onclick = closeDrawer;
function contents() {
  const list = h("div", { class: "toc" });
  for (const c of book.chapters) {
    list.append(h("a", { class: "ch", onclick: () => jump(c.index, 0) }, c.title));
    for (const s of sectionsIn(c.index)) {
      if (s.label === c.title && sectionsIn(c.index).length === 1) continue;
      const cur = c.index === pos.chapter && pos.word >= s.start && pos.word < s.end;
      list.append(h("a", { class: "se" + (cur ? " cur" : ""), onclick: () => jump(s.chapter, s.start) }, h("span", {}, s.label),
        h("span", { class: "sq" }, s.prompts.map((p) => h("i", { class: S.grades[p.id] ? (S.grades[p.id].first === "correct" ? "ok" : "no") : "" })))));
    }
  }
  openDrawer("Contents", list);
  list.querySelector(".cur")?.scrollIntoView({ block: "center" });
}
function search() {
  const hits = h("div", { class: "hits" });
  let timer = null;
  const input = h("input", { type: "text", placeholder: "A word or phrase", "aria-label": "Search the book", oninput: () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const q = input.value.trim();
      if (q.length < 2) return put(hits);
      const { results } = await api(`/jobs/${ID}/book/search?q=${encodeURIComponent(q)}`);
      put(hits, results.length ? results.map((r) => h("a", { onclick: () => jump(r.chapter, r.word) },
        h("span", { class: "m mute" }, chapterAt(r.chapter)?.title || ""), h("div", {}, r.before, h("b", {}, r.match), r.after))) : h("p", { class: "empty" }, "Nothing found."));
    }, 250);
  } });
  openDrawer("Search", [input, hits]); input.focus();
}
function applySettings() {
  const r = document.documentElement;
  r.style.setProperty("--face", settings.face === "sans" ? "var(--grot)" : "var(--serif)");
  r.style.setProperty("--size", settings.size + "px"); r.style.setProperty("--lead", settings.leading);
  r.style.setProperty("--measure", { narrow: "28em", medium: "34em", wide: "42em" }[settings.measure]);
  if (settings.theme === "system") r.removeAttribute("data-theme"); else r.dataset.theme = settings.theme;
}
function textSettings() {
  const pick = (key, options) => h("span", { class: "seg" }, options.map(([v, t]) => h("button", { "aria-pressed": String(settings[key] === v), onclick: () => change(key, v) }, t)));
  function change(key, v) { settings[key] = v; applySettings(); api("/settings", { method: "PUT", json: settings }).catch(() => {}); textSettings(); if (view && view.relayout) view.relayout(); }
  openDrawer("Text", h("div", { class: "set" },
    h("div", {}, h("span", { class: "m" }, "Typeface"), pick("face", [["serif", "Serif"], ["sans", "Grotesk"]])),
    h("div", {}, h("span", { class: "m" }, `Size / ${settings.size} px`), h("span", { class: "seg" }, h("button", { onclick: () => change("size", Math.max(14, settings.size - 1)) }, "Smaller"), h("button", { onclick: () => change("size", Math.min(30, settings.size + 1)) }, "Larger"))),
    h("div", {}, h("span", { class: "m" }, "Line spacing"), pick("leading", [[1.4, "Tight"], [1.6, "Normal"], [1.8, "Open"]])),
    h("div", {}, h("span", { class: "m" }, "Column width"), pick("measure", [["narrow", "Narrow"], ["medium", "Medium"], ["wide", "Wide"]])),
    h("div", {}, h("span", { class: "m" }, "Colours"), pick("theme", [["system", "System"], ["light", "Light"], ["dark", "Dark"]])),
    h("p", { class: "mute" }, "Keys: ← → turn pages or step sentences, space plays RSVP, 1 2 3 change the view, c opens the contents, / searches.")));
}
$("b-notes").onclick = marks;
$("b-toc").onclick = contents; $("b-find").onclick = search; $("b-set").onclick = textSettings;
$("b-rev").onclick = () => { save(true); setTimeout(() => { location.href = "/#/practice/" + ID; }, 150); };

/* ---------- keys ---------- */
addEventListener("keydown", (e) => {
  const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName);
  if (e.key === "Escape") { if ($("drawer").classList.contains("on")) return closeDrawer(); if (stage.querySelector(".notebox")) return closeNote(); }
  if (cp) {
    if (!cp.revealed && e.key === "Enter" && (e.ctrlKey || e.metaKey || !typing)) { e.preventDefault(); cp.revealed = true; return drawCp(); }
    if (cp.revealed && !cp.missed && !typing) { const b = [...stage.querySelectorAll(".cp button.primary")]; if (e.key === "c" || e.key === "x") { e.preventDefault(); b[e.key === "c" ? 0 : 1]?.click(); } }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !view) return;
  if (e.key === "h" || e.key === "n") {
    e.preventDefault();
    if (tipFor) { const r = tipFor; hideTip(); getSelection().removeAllRanges(); addHighlight(r).then((made) => { if (e.key === "n" && made) editItem(made); }); }
    else if (view.mark) view.mark(e.key === "n");
    else if (e.key === "n") editPlace();
    return;
  }
  stage.querySelector(".offer")?.remove();
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); view.next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); view.prev(); }
  else if (e.key === " ") { e.preventDefault(); if (view.toggle) view.toggle(); else if (e.shiftKey) view.prev(); else view.next(); }
  else if (e.key === "1" || e.key === "2" || e.key === "3") setMode(MODES[+e.key - 1][0]);
  else if (e.key === "c") contents(); else if (e.key === "/") { e.preventDefault(); search(); }
  else if (mode === "rsvp" && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); stage.querySelector(e.key === "ArrowUp" ? ".ctl [aria-label=Faster]" : ".ctl [aria-label=Slower]")?.click(); }
});

/* ---------- start ---------- */
(async function init() {
  try {
    [book, S, settings, NB] = await Promise.all([api(`/jobs/${ID}/book`), api(`/jobs/${ID}/reading`), api("/settings").then((s) => ({ ...settings, ...s })), api(`/jobs/${ID}/notes`)]);
  } catch (e) { return put(stage, h("p", { class: "empty" }, e.message, " ", h("a", { href: "/" }, "Back to the library"))); }
  document.title = book.title; $("back").href = "/#/run/" + ID;
  applySettings();
  const want = new URLSearchParams(location.search);
  const first = book.sections[0] || { chapter: book.chapters[0].index, start: 0 };
  const p = S.position || { chapter: first.chapter, word: first.start, mode: "page" };
  mode = p.mode || "page"; pos = { chapter: chapterAt(p.chapter) ? p.chapter : first.chapter, word: p.word };
  const active = S.active_checkpoint, section = active && book.sections.find((s) => s.checkpoint === active.id);
  const go = (want.get("go") || "").match(/^(\d+):(\d+)$/);
  if (go && chapterAt(+go[1])) { delete S.active_checkpoint; pos = { chapter: +go[1], word: +go[2] }; await render(); refreshPractice(); return setPos(pos.chapter, pos.word, false); }
  refreshPractice();
  if (section && active.reread) {      // closed during a reread: back into it, with the way back to the question intact
    reread = { section, held: { index: active.prompt_index, resume: active.resume } };
    mode = active.reread.mode; pos = { chapter: active.reread.chapter, word: active.reread.word };
    return render();
  }
  if (section) {                       // closed during a question: the same question, answer hidden
    mode = active.resume.mode; pos = { chapter: active.resume.chapter, word: active.resume.word };
    await render(); return openCheckpoint(section, Math.min(active.prompt_index, section.prompts.length - 1), active.resume);
  }
  delete S.active_checkpoint;
  await render();
  if (!S.position) setPos(pos.chapter, pos.word, false);
})();
</script>
