[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-processor"
version = "0.1.0"
description = "Add retrieval-practice checkpoints to an EPUB and export the questions for spaced repetition."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5", "genanki>=0.13"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ebook-processor = "ebook_processor.cli:main"

[tool.setuptools.packages.find]
include = ["ebook_processor*"]

[tool.setuptools.package-data]
ebook_processor = ["instructions/*.md", "prep/schema/*.json", "schema/*.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
