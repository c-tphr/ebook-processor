<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebook-processor</title>
<style>
/* Grey paper, black ink, one blue. A blue square always means the same thing: a question that is in the book. */
:root {
  --paper: #ebebeb; --sheet: #f6f6f6; --ink: #121212; --ghost: #d6d6d6; --mute: #686868; --blue: #2b36f5; --on-blue: #ffffff;
  --grot: "Neue Haas Grotesk Display Pro", "Helvetica Neue", Helvetica, "Inter Display", Inter, Arimo, "Liberation Sans", Arial, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --gut: clamp(16px, 3vw, 32px);
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0e0e0e; --sheet: #171717; --ink: #eceae4; --ghost: #303030; --mute: #9b9992; --blue: #7f89ff; --on-blue: #0e0e0e; }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.5 var(--grot); -webkit-font-smoothing: antialiased; }
.frame { max-width: 1120px; margin: 0 auto; padding: 0 var(--gut) 140px; border-left: 1px solid var(--ghost); border-right: 1px solid var(--ghost); min-height: 100vh; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* mono metadata */
.m { font: 12px/1.5 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.mute { color: var(--mute); }
.raw { text-transform: none; }
.kv { display: flex; align-items: baseline; gap: 0; font: 12px/1.9 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.kv > i { flex: 1; min-width: 16px; border-bottom: 1px dotted var(--mute); margin: 0 8px; transform: translateY(-4px); }
.kv > b { font-weight: 400; text-align: right; overflow-wrap: anywhere; text-transform: none; }
.lab { display: inline-block; font: 11px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 6px;
  border: 1px solid var(--ink); white-space: nowrap; }
.lab.inv { background: var(--ink); color: var(--paper); }
.lab.blue { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.lab.quiet { border-color: var(--ghost); color: var(--mute); text-transform: none; }

/* registration marks: a crosshair on two opposite corners */
.reg { position: relative; }
.reg::before, .reg::after { content: ""; position: absolute; width: 21px; height: 21px; pointer-events: none;
  background: linear-gradient(var(--ink), var(--ink)) center / 1px 100% no-repeat, linear-gradient(var(--ink), var(--ink)) center / 100% 1px no-repeat; }
.reg::before { top: -11px; left: -11px; } .reg::after { bottom: -11px; right: -11px; }

/* top strip */
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 0; border-bottom: 1px solid var(--ink); }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 500 17px/1 var(--grot); letter-spacing: -0.02em; }
.mark { display: inline-flex; gap: 3px; align-items: stretch; height: 16px; }
.mark i { background: var(--ink); width: 14px; } .mark i:nth-child(2) { width: 8px; } .mark i:last-child { width: 16px; background: var(--blue); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px var(--gut); align-items: end; padding: clamp(32px, 6vw, 72px) 0 clamp(28px, 4vw, 48px); border-bottom: 1px solid var(--ghost); }
.hero h1 { font: 500 clamp(52px, 10.5vw, 128px)/0.9 var(--grot); letter-spacing: -0.055em; margin: 0 0 0 -0.05em; }
.hero p { max-width: 46ch; margin: 0 0 20px; font-size: 17px; line-height: 1.45; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--ink); margin-right: 7px; }
.legend span.cp::before { background: var(--blue); }
.legend span.out::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); }

/* a titled band: black square, title on the left, content on the right */
.band { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px var(--gut); padding: 36px 0; border-bottom: 1px solid var(--ghost); }
.band > h2 { font: 500 26px/1.1 var(--grot); letter-spacing: -0.035em; margin: 0; display: flex; gap: 10px; align-items: baseline; }
.band > h2::before { content: ""; width: 11px; height: 11px; background: var(--ink); flex: none; transform: translateY(-1px); }
.band > h2 small { display: block; }
.band .side { grid-column: 1; }
.lede { max-width: 60ch; margin: 0 0 18px; }

/* controls */
button, .btn { font: 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 0;
  background: transparent; color: var(--ink); padding: 11px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
button:hover, .btn:hover { background: var(--ink); color: var(--paper); }
button.primary { background: var(--ink); color: var(--paper); padding: 15px 22px; font-size: 13px; }
button.primary:hover { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
button.text { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 11px 4px; }
button.text:hover { background: transparent; color: var(--blue); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
input[type=text], select { font: 15px/1.2 var(--grot); color: var(--ink); background: var(--sheet); border: 1px solid var(--ink); border-radius: 0;
  padding: 10px 11px; width: 100%; }
input::placeholder { color: var(--mute); }
.field { display: block; }
.field > .m { display: block; margin-bottom: 6px; }
.field > small { display: block; color: var(--mute); margin-top: 6px; font-size: 13px; line-height: 1.35; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px var(--gut); margin-top: 26px; }
.grid > .wide { grid-column: 1 / -1; }
.drop { background: var(--sheet); padding: 34px 20px; text-align: center; border: 1px solid var(--ghost); }
.drop.over { border-color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
.drop strong { display: block; font: 500 24px/1.1 var(--grot); letter-spacing: -0.03em; margin-bottom: 14px; }
.drop .row { justify-content: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--ink); }
.seg label { text-align: center; padding: 11px 4px 10px; cursor: pointer; border-right: 1px solid var(--ink); font: 12px/1.3 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg small { display: block; font-size: 10.5px; letter-spacing: 0; color: var(--mute); font-variant-numeric: tabular-nums; }
.seg label:has(input:checked) { background: var(--ink); color: var(--paper); }
.seg label:has(input:checked) small { color: var(--paper); opacity: 0.75; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--blue); outline-offset: 2px; }
details.adv { margin-top: 26px; border-top: 1px solid var(--ghost); padding-top: 14px; }
details.adv > summary { cursor: pointer; font: 12px/1.5 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.actions { margin-top: 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.msg { border: 1px solid var(--ink); border-left-width: 8px; padding: 10px 14px; margin: 16px 0 0; font-size: 15px; max-width: 80ch; }
.msg.err { background: var(--ink); color: var(--paper); }
.msg > div + div { margin-top: 6px; }

/* list of books */
.runs { border-top: 1px solid var(--ink); }
.run { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 4px 18px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--ghost); }
.run .t { font: 500 21px/1.2 var(--grot); letter-spacing: -0.025em; text-decoration: none; }
.run .t:hover { color: var(--blue); }
.run .sub { grid-column: 2; color: var(--mute); font-size: 14px; }
.run .btn, .run .lab { grid-row: 1 / span 2; grid-column: 3; align-self: center; }
.run .prog { grid-column: 2 / -1; height: 4px; margin-top: 6px; background: linear-gradient(to right, var(--ink) calc(var(--p) * 100%), var(--ghost) 0); }
.btn.primary { background: var(--ink); color: var(--paper); padding: 15px 22px; font-size: 13px; }
.btn.primary:hover { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.pr { max-width: 900px; margin: 0 auto; padding: 34px 0 10px; }
.pr .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 28px; }
.pr h1 { font: 500 clamp(26px, 3.6vw, 44px)/1.12 var(--grot); letter-spacing: -0.035em; margin: 0 0 26px; text-wrap: balance; }
.pr textarea { width: 100%; min-height: 110px; font: 17px/1.5 Georgia, "Iowan Old Style", serif; color: var(--ink); background: var(--sheet); border: 1px solid var(--ink); border-radius: 0; padding: 12px 14px; resize: vertical; }
.pr .two { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }
.pr .two > div { padding: 14px 16px 18px; } .pr .two > div + div { border-left: 1px solid var(--ink); background: var(--sheet); }
.pr .two p, .pr .passage p { margin: 8px 0 0; font: 18px/1.5 Georgia, "Iowan Old Style", serif; white-space: pre-wrap; }
.pr .passage { margin-top: 16px; border-left: 8px solid var(--ghost); padding: 2px 0 2px 16px; } .pr .passage p { font-size: 16px; color: var(--mute); }
.pr .acts { margin-top: 22px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.pr .ans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; max-width: 520px; }
.pr .ans button { text-align: left; padding: 14px 16px; } .pr .ans small { display: block; margin-top: 7px; opacity: 0.75; letter-spacing: 0.04em; }
.pr .done b { display: block; font: 500 clamp(40px, 7vw, 84px)/0.95 var(--grot); letter-spacing: -0.05em; margin-bottom: 18px; }
kbd { font: 11px/1 var(--mono); border: 1px solid currentColor; padding: 2px 4px; margin-left: 6px; opacity: 0.7; }
.num { width: 9ch; font: 15px/1.2 var(--mono); color: var(--ink); background: var(--sheet); border: 1px solid var(--ink); padding: 9px 10px; border-radius: 0; }
@media (max-width: 760px) { .pr .two { grid-template-columns: 1fr; } .pr .two > div + div { border-left: 0; border-top: 1px solid var(--ink); } }
.hero h1.book { font-size: clamp(40px, 7vw, 88px); line-height: 0.95; text-wrap: balance; margin-top: 10px; }
.map .col > i.no { background: var(--ink); }
.map .col > i.todo { background: transparent; box-shadow: inset 0 0 0 1.5px var(--blue); }
.legend span.no::before { background: var(--ink); } .legend span.todo::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--blue); }
.legend span.cp::before { background: var(--blue); }
.empty { color: var(--mute); padding: 18px 0; margin: 0; }

/* one run */
.back { display: inline-block; margin: 22px 0 0; }
.title { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr); gap: 24px var(--gut); align-items: end; padding: 26px 0 30px; border-bottom: 1px solid var(--ink); }
.title h1 { font: 500 clamp(36px, 6.2vw, 76px)/0.95 var(--grot); letter-spacing: -0.05em; margin: 0 0 0 -0.04em; text-wrap: balance; overflow-wrap: anywhere; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-bottom: 14px; }
.steps span { border-top: 10px solid var(--ghost); padding-top: 7px; color: var(--mute); }
.steps span.past { border-color: var(--ink); color: var(--ink); } .steps span.on { border-color: var(--blue); color: var(--ink); }
.cells { display: grid; grid-template-columns: repeat(32, 1fr); gap: 2px; height: 22px; margin: 4px 0 14px; }
.cells i { background: var(--ghost); } .cells i.f { background: var(--ink); }
.cells.wait i { animation: march 1.6s steps(1) infinite; animation-delay: calc(var(--n) * 50ms); }
@keyframes march { 0%, 88% { background: var(--ghost); } 89%, 100% { background: var(--blue); } }
@media (prefers-reduced-motion: reduce) { .cells.wait i { animation: none; } }
.log { font: 12px/1.7 var(--mono); color: var(--mute); max-height: 240px; overflow: auto; margin: 14px 0 0; padding: 12px 0 0; list-style: none; border-top: 1px solid var(--ghost); }
.log .w { color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--ghost); }
.stat { padding: 22px 0 18px; border-left: 1px solid var(--ghost); padding-left: 14px; }
.stat:first-child { border-left: 0; padding-left: 0; }
.stat b { display: block; font: 500 clamp(40px, 6vw, 68px)/0.95 var(--grot); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }

/* the book as a strip: each black block a section, sized by its words; the squares after it are its questions */
.map { display: flex; align-items: flex-start; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
.map .col { flex: var(--w) 1 0; min-width: 9px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.map .sec { display: block; align-self: stretch; height: 64px; background: var(--ink); }
.map a.sec:hover, .map a.sec:focus-visible { background: var(--blue); }
.map .sec.bare { background: var(--ghost); }
.map .col > i { width: 9px; height: 9px; background: var(--blue); }
.map .col > i.out { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); }
.map .gap { flex: 0 0 9px; }
.map.big .sec { height: 78px; } .map.big .col > i { width: 13px; height: 13px; }

.files { border-top: 1px solid var(--ink); }
.file { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--ghost); }
.file b { font: 500 18px/1.25 var(--grot); letter-spacing: -0.02em; } .file small { color: var(--mute); grid-column: 1; font-size: 14px; }
.file .btn { grid-row: 1 / span 2; grid-column: 2; }
.filters { display: flex; gap: 0; flex-wrap: wrap; margin: 4px 0 8px; }
.filters button { margin-right: -1px; }
.filters button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
.chap { margin: 34px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
.section { border-bottom: 1px solid var(--ghost); padding: 18px 0 6px; scroll-margin-top: 16px; }
.section > header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
.section > header b { font: 500 21px/1.2 var(--grot); letter-spacing: -0.03em; }
.q { display: grid; grid-template-columns: 30px minmax(0, 1fr); padding: 12px 0; }
.q input { appearance: none; -webkit-appearance: none; width: 17px; height: 17px; margin: 4px 0 0; border: 1.5px solid var(--ink); background: transparent; cursor: pointer; }
.q input:checked { background: var(--blue); border-color: var(--blue); }
.q input:disabled { cursor: not-allowed; background: repeating-linear-gradient(135deg, var(--ink) 0 1.5px, transparent 1.5px 4.5px); }
.q .qt { font-weight: 600; letter-spacing: -0.01em; text-wrap: pretty; cursor: pointer; }
.q .at { margin-top: 4px; max-width: 72ch; text-wrap: pretty; }
.q.off .qt, .q.off .at { color: var(--mute); }
.q.off .qt { text-decoration: line-through; text-decoration-thickness: 1px; }
.q .meta { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.note { font-size: 14px; color: var(--mute); margin: 8px 0 0; max-width: 72ch; }
.sticky { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--paper); padding: 12px var(--gut); display: none; }
.sticky.on { display: block; }
.sticky > div { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sticky button { border-color: var(--paper); color: var(--paper); }
.sticky button:hover { background: var(--paper); color: var(--ink); }
.sticky button.go { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }

@media (max-width: 760px) {
  .hero, .band, .title, .grid { grid-template-columns: minmax(0, 1fr); }
  .band { padding: 28px 0; }
  .stats { grid-template-columns: repeat(2, 1fr); } .stat:nth-child(3) { border-left: 0; padding-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--ghost); }
  .run { grid-template-columns: minmax(0, 1fr) auto; } .run .d { display: none; } .run .sub { grid-column: 1; } .run .btn, .run .lab { grid-column: 2; } .run .prog { grid-column: 1 / -1; }
  .reg::before, .reg::after { display: none; }
}
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>ebook-processor</a>
    <span class="m" id="claude">Checking Claude Code</span>
  </header>
  <main id="app"></main>
</div>
<div class="sticky" id="sticky"><div><span class="m" id="sticky-text"></span>
  <span class="row"><button id="sticky-reset">Undo changes</button><button class="go" id="sticky-go">Rebuild files</button></span></div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "checked" || k === "disabled") el[k] = !!v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
async function api(path, options = {}) {
  const headers = { "X-Ebook-Processor": "1", ...(options.headers || {}) };
  if (options.json !== undefined) { options.body = JSON.stringify(options.json); headers["Content-Type"] = "application/json"; }
  const response = await fetch("/api" + path, { ...options, headers });
  const data = await response.json().catch(() => ({ error: "The app gave an unreadable answer." }));
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false));
const fmt = (n) => Number(n).toLocaleString("en");
const kv = (key, value) => h("div", { class: "kv" }, h("span", {}, key), h("i"), h("b", {}, value));
const day = (iso) => new Date(iso).toISOString().slice(0, 10);
const band = (title, ...kids) => h("section", { class: "band" }, h("h2", {}, title), h("div", {}, kids));
const STATUS = { queued: "Waiting", running: "Working", done: "Finished", failed: "Failed", stopped: "Stopped" };
const STATUS_LAB = { queued: "lab", running: "lab blue", done: "lab inv", failed: "lab", stopped: "lab" };
const STAGES = [["draft", "Draft"], ["check", "Check"], ["revise", "Revise"], ["build", "Build"]];
const CRITERIA = {
  supported_by_section: "answer says something its section does not",
  accepts_paraphrase: "answer too vague, thin or detailed to grade against",
  answerable_from_section: "cannot be answered from its section alone",
  does_not_give_away_answer: "question gives its answer away",
  stands_alone: "cannot be understood without the page",
};
const FILES = [
  ["visible", "Book with visible checkpoints", "For any reading app: each question on its own page, its answer on the next."],
  ["prepared", "Book for the Picco firmware", "Invisible markers and a checkpoint data file. The text is untouched."],
  ["anki", "Anki deck", "One card per question, with the supporting passage on the back."],
  ["tsv", "Cards as text", "Tab-separated, for other spaced-repetition apps."],
  ["questions", "Questions as data", "Structured JSON: sections, questions, answers, passages, check results."],
  ["report", "Report", "What was made, what was left out and why."],
];
let info = null, timer = null, view = { removed: new Set(), saved: new Set(), filter: "all" };

function route() {
  clearTimeout(timer); $("sticky").classList.remove("on"); window.scrollTo(0, 0);
  const m = location.hash.match(/^#\/run\/([0-9a-z-]+)$/);
  const p = location.hash.match(/^#\/practice(?:\/([0-9a-z-]+))?$/);
  if (m) showRun(m[1]); else if (p) showPractice(p[1] || null); else if (location.hash === "#/add") showAdd(); else showLibrary();
}
window.addEventListener("hashchange", route);

async function init() {
  try { info = await api("/info"); }
  catch (e) { info = { claude: { ok: false, error: String(e) }, densities: {}, defaults: {}, version: "", data: "" }; }
  const pill = $("claude");
  pill.textContent = info.claude.ok ? "Claude Code " + info.claude.version.replace(/\s*\(.*/, "") + " / ready" : "Claude Code / not ready";
  if (!info.claude.ok) pill.title = info.claude.error;
  route();
}

/* ---------- home ---------- */
function showAdd() {
  const app = $("app");
  let file = null;
  const error = h("div", { class: "msg err", role: "alert", hidden: true });
  const name = h("span", { class: "m mute" }, "No file chosen");
  const input = h("input", { type: "file", accept: ".epub,application/epub+zip", hidden: true, onchange: () => choose(input.files[0]) });
  const pathInput = h("input", { type: "text", placeholder: "/home/you/Books/Title.epub", id: "path" });
  function choose(f) {
    if (!f) return;
    file = f; pathInput.value = "";
    name.textContent = `${f.name} / ${(f.size / 1048576).toFixed(1)} MB`; name.classList.remove("mute");
  }
  const drop = h("div", { class: "drop reg",
    ondragover: (e) => { e.preventDefault(); drop.classList.add("over"); },
    ondragleave: () => drop.classList.remove("over"),
    ondrop: (e) => { e.preventDefault(); drop.classList.remove("over"); choose(e.dataTransfer.files[0]); } },
    h("strong", {}, "Drop an EPUB here"),

      if (chapter !== null && s.chapter !== chapter) map.append(h("i", { class: "gap" }));
      chapter = s.chapter;
      map.append(h("div", { class: "col", style: `--w:${Math.max(1, s.words || 1)}` }, h("a", { class: "sec" + (s.questions.length ? "" : " bare"), href: "#",
        title: `${s.label} / ${fmt(s.words || 0)} words / ${s.questions.length} question${s.questions.length === 1 ? "" : "s"}`,
        "aria-label": s.label,
        onclick: (e) => { e.preventDefault(); if (view.filter !== "all") { view.filter = "all"; drawDone(); }
          document.getElementById("sec-" + s.id)?.scrollIntoView({ behavior: "smooth", block: "start" }); } }),
        s.questions.map((q) => h("i", { class: !q.can_keep || view.removed.has(q.id) ? "out" : !job.reading ? "" : res[q.id] === "missed" ? "no" : res[q.id] ? "" : "todo", "data-q": q.id }))));
    }
    return map;
  }
  function drawDone() {
    const r = job.report, c = r.counts;
    const all = review.sections.flatMap((s) => s.questions);
    const notes = [...(r.notes || []), ...(r.warnings || [])];
    const list = h("div");
    const filters = [["all", `All ${all.length}`], ["out", `Left out ${all.filter((q) => !q.can_keep).length}`],
      ["remarks", `With remarks ${all.filter((q) => q.minor_note).length}`]];
    put(body,
      h("div", { class: "stats" },
        [[c.questions, "Questions"], [c.checkpoints, "Checkpoints"], [c.sections, "Sections"], [c.left_out, "Left out"]].map(([n, t]) =>
          h("div", { class: "stat" }, h("b", {}, fmt(n)), h("span", { class: "m" }, t)))),
      band("The book", bookMap(),
        job.reading
          ? h("div", { class: "legend m" }, h("span", {}, "Section, by length"), h("span", { class: "cp" }, "Recalled on the first try"), h("span", { class: "no" }, "Missed"), h("span", { class: "todo" }, "Not yet met"), h("span", { class: "out" }, "Left out"))
          : h("div", { class: "legend m" }, h("span", {}, "Section, by length"), h("span", { class: "cp" }, "Question at its end"), h("span", { class: "out" }, "Left out"))),
      band("Files",
        r.files.prepared && !r.firmware_format_ok ? h("div", { class: "msg", style: "margin:0 0 16px" }, "The firmware-format book did not pass all its structure checks. The report says which.") : null,
        notes.length ? h("div", { class: "msg", style: "margin:0 0 16px" }, notes.map((n) => h("div", {}, n))) : null,
        job.reading ? h("div", { class: "row", style: "margin-bottom:16px" }, h("span", { class: "m" }, "Cards in the deck and the text file"),
          h("div", { class: "filters", role: "group", style: "margin:0" }, [["all", "All"], ["missed", "Missed on the first try"], ["reached", "Met while reading"]].map(([k, t]) =>
            h("button", { type: "button", "aria-pressed": String((r.cards || "all") === k), onclick: async (e) => {
              e.target.disabled = true;
              try { job = await api(`/jobs/${id}/rebuild`, { method: "POST", json: { cards: k } }); drawHead(); await loadReview(); } catch (err) { alert(err.message); }
            } }, t)))) : null,
        h("div", { class: "files" }, FILES.map(([key, title, what]) => {
          const name = r.files[key];
          return h("div", { class: "file" }, h("b", {}, title), h("small", {}, name ? what : "Not written. The report says why."),
            name ? h("a", { class: "btn", href: `/api/jobs/${id}/files/${encodeURIComponent(name)}`, download: name }, "Download") : null);
        }))),
      band("Questions",
        h("p", { class: "lede" }, "Untick any question you do not want, then rebuild. Rebuilding takes seconds and does not call Claude."),
        h("div", { class: "filters", role: "group", "aria-label": "Show" }, filters.map(([k, t]) =>
          h("button", { type: "button", "aria-pressed": String(view.filter === k), onclick: () => { view.filter = k; drawDone(); } }, t))),
        list));
    let chapter = null;
    for (const s of review.sections) {
      const qs = s.questions.filter((q) => view.filter === "all" || (view.filter === "out" ? !q.can_keep : !!q.minor_note));
      if (!qs.length && view.filter !== "all") continue;
      if (s.chapter !== chapter) { chapter = s.chapter; list.append(h("div", { class: "chap m" }, chapter)); }
      list.append(h("section", { class: "section", id: "sec-" + s.id },
        h("header", {}, h("b", {}, s.label), h("span", { class: "m mute raw" }, `${s.id} / ${s.first_paragraph}–${s.last_paragraph.split("-")[1]} / ${fmt(s.words || 0)} words`)),
        s.natural_boundary === false ? h("p", { class: "note" }, "The checker doubted this section's break: " + s.boundary_note) : null,
        qs.length ? qs.map(question) : h("p", { class: "note" }, "No questions for this section.")));
    }
    if (!list.children.length) list.append(h("p", { class: "empty" }, "Nothing to show here."));
    drawSticky();
  }
  function question(q) {
    const off = !q.can_keep || view.removed.has(q.id);
    const row = h("div", { class: "q" + (off ? " off" : "") });
    const box = h("input", { type: "checkbox", checked: !off, disabled: !q.can_keep, id: "q-" + q.id, "aria-label": "Keep question " + q.id,
      onchange: () => {
        box.checked ? view.removed.delete(q.id) : view.removed.add(q.id); row.classList.toggle("off", !box.checked);
        document.querySelector(`.map i[data-q="${q.id}"]`)?.classList.toggle("out", !box.checked); drawSticky(); } });
    const tags = [h("span", { class: "lab quiet" }, q.id)];
    if (q.status === "failed") tags.push(h("span", { class: "lab inv" }, "Left out / failed the check"));
    else if (q.status === "withdrawn") tags.push(h("span", { class: "lab inv" }, "Left out / withdrawn"));
    else if (q.status !== "passed") tags.push(h("span", { class: "lab" }, "Not checked"));
    else if (q.revisions) tags.push(h("span", { class: "lab" }, "Passed after revision"));
    row.append(box, h("div", {},
      h("label", { class: "qt", for: "q-" + q.id }, q.question), h("div", { class: "at" }, q.answer),
      h("div", { class: "meta" }, tags),
      q.failed_criteria.length ? h("p", { class: "note" }, "Why: " + q.failed_criteria.map((k) => CRITERIA[k] || k).join("; ") + ". " + (q.problem || "")) : null,
      q.minor_note ? h("p", { class: "note" }, "Checker's remark: " + q.minor_note) : null));
    return row;
  }
  function drawSticky() {
    const changed = [...view.removed].filter((x) => !view.saved.has(x)).length + [...view.saved].filter((x) => !view.removed.has(x)).length;
    $("sticky").classList.toggle("on", changed > 0);
    $("sticky-text").textContent = `${changed} change${changed === 1 ? "" : "s"} not yet in the files / ${view.removed.size} question${view.removed.size === 1 ? "" : "s"} removed`;
    $("sticky-reset").onclick = () => { view.removed = new Set(view.saved); drawDone(); };
    $("sticky-go").onclick = async () => {
      $("sticky-go").disabled = true; $("sticky-go").textContent = "Rebuilding";
      try { job = await api(`/jobs/${id}/rebuild`, { method: "POST", json: { removed: [...view.removed] } }); drawHead(); await loadReview(); }
      catch (e) { alert(e.message); }
      $("sticky-go").disabled = false; $("sticky-go").textContent = "Rebuild files";
    };
  }
  poll();
}
init();
</script>
</body>
</html>
