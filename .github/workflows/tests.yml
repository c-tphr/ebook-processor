# Runs the tests after every push: the test suite on Linux, Windows and macOS, and the app itself in Chromium,
# Firefox and WebKit (the engine of Safari). The tests call no model and need no login: stand-ins answer in place
# of Claude Code and Codex.
name: Tests

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false  # a failure on one system does not hide the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"  # the oldest Python the tool supports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      # EPUBCheck is fetched once and kept between runs. Here a test that could not run it fails; it is not skipped.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ebook-processor
          key: epubcheck-5.3.0-${{ runner.os }}
      - name: Test
        run: python -m pytest -q
        env:
          EBOOK_PROCESSOR_TESTS_MAY_DOWNLOAD: "1"
          EBOOK_PROCESSOR_TESTS_NEED_EPUBCHECK: "1"

  browser:
    name: ${{ matrix.browser }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chromium }
          - { os: ubuntu-latest, browser: firefox }
          - { os: windows-latest, browser: chromium }
          - { os: windows-latest, browser: firefox }
          - { os: macos-latest, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[browser]"
      - name: Install the browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test
        run: python -m pytest tests/browser -q --browser ${{ matrix.browser }}
