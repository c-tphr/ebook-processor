[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-processor"
dynamic = ["version"]  # the one place it is written is ebook_processor/__init__.py
description = "Add retrieval-practice checkpoints to a book or an article and export the questions for spaced repetition."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18,<5",
    "genanki>=0.13",
    # other sources than EPUB (ebook_processor/sources)
    "markdown>=3.6,<4",
    "lxml>=5,<7",
    "charset-normalizer>=3,<4",
    "trafilatura>=2,<3",  # finds the article in a web page
    "mammoth>=1.8,<2",  # reads Word files
]

[project.optional-dependencies]
test = ["pytest>=7"]
lint = ["ruff>=0.6"]
browser = ["pytest>=7", "pytest-playwright>=0.5", "playwright>=1.49"]  # the app in Chromium, Firefox and WebKit

[project.scripts]
ebook-processor = "ebook_processor.cli:main"

[tool.setuptools.packages.find]
include = ["ebook_processor*"]

[tool.setuptools.package-data]
ebook_processor = ["instructions/*.md", "prep/schema/*.json", "schema/*.json", "web/static/*"]

[tool.setuptools.dynamic]
version = { attr = "ebook_processor.__version__" }

# The linter looks for real faults (a name that does not exist, an import or a variable nobody uses) and for the
# few rules the code already marks its exceptions to with "noqa". It does not judge the style of the code.
[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "N802", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["epubcheck: starts Java for the real EPUBCheck, seconds each; leave them out with -m 'not epubcheck'"]
filterwarnings = ["ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning"]  # from pytest-playwright
